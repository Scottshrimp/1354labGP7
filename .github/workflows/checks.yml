name: Desktop checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q projects tools
      - name: Run standalone simulations
        run: python -m unittest discover -s projects/standalone/src/tests -v
      - name: Rebuild standalone firmware
        run: python projects/standalone/src/tools/build_song.py
      - name: Verify generated files are current
        # ast.unparse formatting differs across Python versions.
        # Python 3.13 is the reference for committed deployment snapshots.
        if: matrix.python-version == '3.13'
        run: git diff --exit-code -- projects/standalone/src/microbit_main.py projects/standalone/src/deploy/main.py projects/standalone/music/megalovania/song.json
