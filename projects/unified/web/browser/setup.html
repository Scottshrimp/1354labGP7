    <section class="browser-setup" id="web-setup" aria-label="Connect micro:bits">
      <div class="pairing">
        <div class="pair-buttons">
          <button type="button" id="connect-1" disabled>Connect player 1</button>
          <button type="button" id="connect-2" disabled>Connect player 2</button>
        </div>
        <p id="usb-message" role="status"></p>
      </div>
      <aside class="firmware-card" id="firmware-card" aria-labelledby="firmware-heading">
        <div class="firmware-head">
          <h2 id="firmware-heading">micro:bit firmware</h2>
          <button type="button" class="firmware-hide" id="firmware-hide"
            aria-controls="firmware-card" aria-label="Hide firmware card" title="Hide">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5 7.5 8 3 12.5M9 3.5 13.5 8 9 12.5"/></svg>
          </button>
        </div>
        <div class="firmware-actions">
          <a class="firmware-download" href="./main.py" download>Download main.py</a>
          <a href="./tutorial/">Tutorial</a>
        </div>
      </aside>
      <button type="button" class="firmware-tab" id="firmware-show"
        aria-controls="firmware-card" aria-label="Show firmware card" title="micro:bit firmware">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg>
        <span>FIRMWARE</span>
      </button>
    </section>
