<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Rhythm Hit 雙人對局</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314161c'/%3E%3Cpath d='M16 5l4 4h-8zM27 16l-4 4v-8zM16 27l-4-4h8zM5 16l4-4v8z' fill='%23ff6b57'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233fc8e0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/console.js"></script>
</head>
<body>
  <div class="app" id="app" data-phase="boot">
    <header class="top">
      <a class="brand" href="/" aria-label="Rhythm Hit 雙人對局">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path class="mark-a" d="M16 3l5 5H11z"/>
          <path class="mark-b" d="M29 16l-5 5V11z"/>
          <path class="mark-a" d="M16 29l-5-5h10z"/>
          <path class="mark-b" d="M3 16l5-5v10z"/>
          <circle cx="16" cy="16" r="3.2"/>
        </svg>
        <span class="brand-name">Rhythm Hit</span>
        <span class="brand-sub">雙人對局</span>
      </a>
      <p class="link" id="connection" data-online="false" role="status">
        <i class="dot" aria-hidden="true"></i><span id="connection-text">正在連線</span>
      </p>
    </header>

    <ol class="steps" id="steps" aria-label="對局流程">
      <li data-step="0"><span class="step-no">01</span><span class="step-name">選曲</span></li>
      <li data-step="1"><span class="step-no">02</span><span class="step-name">Ready</span></li>
      <li data-step="2"><span class="step-no">03</span><span class="step-name">同步</span></li>
      <li data-step="3"><span class="step-no">04</span><span class="step-name">演奏</span></li>
      <li data-step="4"><span class="step-no">05</span><span class="step-name">結算</span></li>
    </ol>

    <section class="stage" aria-labelledby="heading">
      <p class="eyebrow" id="phase" aria-live="polite">連線中</p>
      <h1 id="heading">正在連接 host</h1>
      <p class="hint" id="hint">請先在終端機啟動 multiplayer.py。</p>
      <p class="notice" id="notice" role="status" hidden></p>
    </section>

    <form class="picker" id="picker" hidden>
      <fieldset>
        <legend>選擇曲目</legend>
        <div class="tracks" id="tracks"></div>
      </fieldset>
      <div class="picker-foot">
        <p class="selection" id="selection" aria-live="polite">尚未選擇曲目</p>
        <button id="confirm" type="submit">
          <span>確認曲目</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4l4 4-4 4"/></svg>
        </button>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <section class="timeline" id="timeline" aria-label="歌曲進度" hidden>
      <div class="timeline-head">
        <span class="track-title" id="track-title"></span>
        <span class="clock"><span id="elapsed">0:00</span><span class="clock-sep">/</span><span id="duration">0:00</span></span>
      </div>
      <div class="bar" role="progressbar" id="bar" aria-label="歌曲進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
    </section>

    <section class="arena" aria-label="玩家狀態與分數">
      <article class="player" id="player-1" data-player="1" data-status="disconnected">
        <header class="player-head">
          <span class="badge">P1</span>
          <h2>玩家 1</h2>
          <span class="status"><i class="dot" aria-hidden="true"></i><span class="status-text">未連線</span></span>
        </header>
        <div class="idle-view">
          <span class="glyph" aria-hidden="true"></span>
          <p class="idle-text">請用 USB 連接設備</p>
        </div>
        <div class="score-view" hidden>
          <div class="score-line">
            <output class="score">0</output>
            <span class="outcome" hidden></span>
          </div>
          <dl class="stats">
            <div><dt>連擊</dt><dd class="combo">0</dd></div>
            <div><dt>Miss</dt><dd class="miss">0</dd></div>
            <div><dt>達成率</dt><dd class="acc">0%</dd></div>
          </dl>
          <div class="meter" aria-hidden="true"><div class="meter-fill"></div></div>
        </div>
      </article>

      <div class="versus" id="versus" aria-live="polite">
        <span class="vs">VS</span>
        <span class="lead" id="lead"></span>
      </div>

      <article class="player" id="player-2" data-player="2" data-status="disconnected">
        <header class="player-head">
          <span class="badge">P2</span>
          <h2>玩家 2</h2>
          <span class="status"><i class="dot" aria-hidden="true"></i><span class="status-text">未連線</span></span>
        </header>
        <div class="idle-view">
          <span class="glyph" aria-hidden="true"></span>
          <p class="idle-text">請用 USB 連接設備</p>
        </div>
        <div class="score-view" hidden>
          <div class="score-line">
            <output class="score">0</output>
            <span class="outcome" hidden></span>
          </div>
          <dl class="stats">
            <div><dt>連擊</dt><dd class="combo">0</dd></div>
            <div><dt>Miss</dt><dd class="miss">0</dd></div>
            <div><dt>達成率</dt><dd class="acc">0%</dd></div>
          </dl>
          <div class="meter" aria-hidden="true"><div class="meter-fill"></div></div>
        </div>
      </article>
    </section>

    <footer class="legend" aria-label="micro:bit 操作">
      <span><kbd>→</kbd>在設備上 Ready</span>
      <span><kbd>←</kbd>取消或返回大廳</span>
      <span class="legend-note">對局中不能暫停</span>
    </footer>
  </div>

  <div class="countdown" id="countdown" hidden aria-hidden="true">
    <span class="count" id="count"></span>
  </div>
</body>
</html>
