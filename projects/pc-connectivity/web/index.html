<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythm Hold · 双人联机</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf1ff;background:#111629}body{max-width:900px;margin:0 auto;padding:32px 20px}h1{margin-bottom:4px}p{color:#b3bfdd}.panel,.device{background:#202943;border:1px solid #3c4868;border-radius:14px;padding:20px;margin:16px 0}.devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.device{margin:0}button{border:0;border-radius:8px;padding:12px 18px;margin:8px 8px 0 0;background:#86e4b5;color:#102419;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.stop{background:#f39b9c;color:#351316}select,input{padding:10px;border-radius:8px}input{width:85px}strong{font-size:1.4em}progress{width:100%}.error{color:#ffaaaa}small{color:#b3bfdd}
</style></head><body>
<h1>Rhythm Hold · 双人联机</h1><p>连接已刷入联机程序的 micro:bit，准备完成后一起开始。</p>
<section class="panel"><label for="song">歌曲 </label><select id="song"></select><p><label for="offset">音频偏移（毫秒）</label> <input id="offset" type="number" min="-1000" max="1000" step="10" value="0"> <small>正数延后音乐，负数提前音乐</small></p><p id="phase"></p><p id="error" class="error" role="alert"></p><button id="prepare">下载谱面</button><button id="start">开始</button><button id="stop" class="stop">结束</button></section>
<section><h2>玩家</h2><div class="devices" id="devices"></div><p id="empty">等待连接设备（最多两台）。</p></section>
<section class="panel" id="ranking" hidden><h2>最终排名</h2><ol id="results"></ol></section>
<script>
let token='', busy=false; const $=id=>document.getElementById(id);
const labels={idle:'等待准备',preparing:'正在下载谱面',ready:'已准备，可以开始',starting:'倒计时中',playing:'游戏进行中',finished:'游戏结束'};
const states={CONNECTING:'连接中',IDLE:'已连接',LOAD:'下载中',READY:'已准备',START:'倒计时',PLAY:'游玩中',DONE:'已结束',FAULT:'通信超时',DISCONNECTED:'已断开'};
function text(tag, value){let e=document.createElement(tag);e.textContent=value;return e}
async function refresh(){try{const s=await(await fetch('/api/state')).json();token=s.token;$('phase').textContent=labels[s.phase]||s.phase;$('error').textContent=s.error||'';if(!$('song').options.length)s.songs.forEach(song=>$('song').add(new Option(song.title,song.id)));$('song').disabled=['preparing','starting','playing'].includes(s.phase);$('offset').disabled=['starting','playing'].includes(s.phase);$('prepare').disabled=busy||!s.devices.length||['preparing','starting','playing'].includes(s.phase);$('start').disabled=busy||s.phase!=='ready';$('stop').disabled=busy||!['preparing','ready','starting','playing'].includes(s.phase);$('empty').hidden=!!s.devices.length;$('devices').replaceChildren();s.devices.forEach((d,i)=>{let card=document.createElement('article');card.className='device';card.append(text('h3',`玩家 ${i+1}`),text('small',d.port),text('p',states[d.state]||d.state),text('p',`得分 ${d.score} · 连击 ${d.combo}`),text('p',`最佳连击 ${d.best} · Miss ${d.misses}`));let bar=document.createElement('progress');bar.max=100;bar.value=d.progress;card.append(bar,text('small',` 谱面 ${d.progress}%`));if(d.error)card.append(text('p',d.error));$('devices').append(card)});$('ranking').hidden=s.phase!=='finished';$('results').replaceChildren();if(s.phase==='finished')s.results.slice().sort((a,b)=>b.score-a.score||b.best-a.best).forEach(d=>$('results').append(text('li',`${d.port} — ${d.score} 分，最佳连击 ${d.best}`)))}catch(e){$('error').textContent='无法连接本地服务：'+e.message}}
async function action(name){busy=true;try{let r=await fetch('/api/'+name,{method:'POST',headers:{'X-Game-Token':token,'Content-Type':'application/json'},body:JSON.stringify({song:$('song').value,offset_ms:Number($('offset').value)})});if(!r.ok)throw Error((await r.json()).error||r.statusText)}catch(e){$('error').textContent=e.message}finally{busy=false;refresh()}}
$('prepare').onclick=()=>action('prepare');$('start').onclick=()=>action('start');$('stop').onclick=()=>action('stop');refresh();setInterval(refresh,500);
</script></body></html>
